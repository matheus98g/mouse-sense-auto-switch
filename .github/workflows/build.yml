name: Build

# Checks that pull requests compile and attaches the resulting exe as a
# downloadable artifact for testing. Read-only: it never publishes anything.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: |
          call build.cmd
          if not exist bin\MouseSwitch.exe exit /b 1

      - uses: actions/upload-artifact@v4
        with:
          name: MouseSwitch-pr${{ github.event.pull_request.number }}
          path: bin/MouseSwitch.exe
          retention-days: 7
