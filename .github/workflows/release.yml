name: Release

# Builds MouseSwitch.exe with the csc.exe that ships with Windows and attaches it
# to a GitHub release. Triggered by pushing a version tag, e.g. v1.0.0.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: |
          call build.cmd
          if not exist bin\MouseSwitch.exe exit /b 1

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" bin/MouseSwitch.exe --title "$env:GITHUB_REF_NAME" --generate-notes
